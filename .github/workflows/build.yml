name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          - python-version: "3.13"
            os: windows-latest
          - python-version: "3.13"
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime and development tools
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check Python errors
        run: python -m ruff check .
      - name: Run offline tests
        run: python -m pytest -q -m "not integration" --junitxml=test-results.xml
      - name: Annotate test failures
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path("test-results.xml")
          if report.exists():
              for case in ET.parse(report).iter("testcase"):
                  for failure in list(case.findall("failure")) + list(case.findall("error")):
                      message = (failure.text or failure.get("message", "Test failed"))[-6000:]
                      message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error title={case.get('name', 'Test failure')}::{message}")

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip ".[dev]"
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Test conversation diagnostics from the source distribution
        run: |
          sdist_dir=$(mktemp -d)
          tar -xzf dist/*.tar.gz -C "$sdist_dir" --strip-components=1
          cd "$sdist_dir"
          python -m pytest -q tests/test_conversation_smoke.py
      - name: Install built wheel independently of the source tree
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/wheel-test/bin/python -c "import gpt3discord; from services.environment_service import EnvService; assert EnvService.find_shared_file('conversation_starter_pretext.txt').is_file(); assert EnvService.find_shared_file('openers').is_dir()"
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  integrations:
    name: Optional integrations / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip ".[dev,full]"
      - run: python -m pip check
      - name: Import optional integration modules without contacting providers
        env:
          ALLOWED_GUILDS: "123456789012345678"
        run: python -c "import cogs.index_service_cog, cogs.search_service_cog, cogs.code_interpreter_service_cog, services.pinecone_service, models.image_understanding_model"
      - run: python -m pytest -q -m "not integration"
